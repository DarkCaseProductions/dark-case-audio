name: Build Dark Case Audio Android test APK

on:
  push:
    branches:
      - android-native-build
    paths:
      - "iphone-app/**"
      - ".github/workflows/build-android-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iphone-app
    steps:
      - name: Check out Android build branch
        uses: actions/checkout@v4
        with:
          ref: android-native-build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iphone-app/package.json
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK with embedded JavaScript
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Sign test APK for device installation
        run: |
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -storetype JKS -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --out android/app/build/outputs/apk/release/dark-case-audio-test.apk "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android/app/build/outputs/apk/release/dark-case-audio-test.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: dark-case-audio-android-test-apk
          path: iphone-app/android/app/build/outputs/apk/release/dark-case-audio-test.apk
          if-no-files-found: error
          retention-days: 14
