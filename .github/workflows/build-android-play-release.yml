name: Build Dark Case Audio Google Play bundle

on:
  workflow_dispatch:
  push:
    branches:
      - android-billing-choice

permissions:
  contents: read

jobs:
  build-play-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iphone-app
    steps:
      - name: Check out the branch selected for this run
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Check upload signing secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dca-upload-key.jks"
          keytool -list -keystore "$RUNNER_TEMP/dca-upload-key.jks" -storepass "$ANDROID_UPLOAD_KEYSTORE_PASSWORD" -alias "$ANDROID_UPLOAD_KEY_ALIAS" >/dev/null
          echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/dca-upload-key.jks" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iphone-app/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Verify generated Android SDK configuration
        run: |
          grep -R "compileSdkVersion 36\|compileSdk 36" android/build.gradle android/app/build.gradle
          grep -R "targetSdkVersion 36\|targetSdk 36" android/build.gradle android/app/build.gradle

      - name: Configure release signing
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "signingConfigs {" not in s:
              raise SystemExit("Could not find signingConfigs block in generated Gradle file")
          release_config = """signingConfigs {
                  release {
                      storeFile file(System.getenv("UPLOAD_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_UPLOAD_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
                  }"""
          s = s.replace("signingConfigs {", release_config, 1)
          s, count = re.subn(
              r"(buildTypes\s*\{[\s\S]*?release\s*\{[\s\S]*?signingConfig\s+)signingConfigs\.debug",
              r"\1signingConfigs.release",
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not replace release signing configuration safely")
          p.write_text(s)
          PY

      - name: Build signed Android App Bundle
        env:
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          jarsigner -verify "$APK" >/dev/null
          BUNDLE="app/build/outputs/bundle/release/app-release.aab"
          test -s "$BUNDLE"
          jarsigner -verify "$BUNDLE" >/dev/null
          echo "Built and verified signed app bundle."

      - name: Upload Google Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: dark-case-audio-tester-builds
          path: |
            iphone-app/android/app/build/outputs/apk/release/app-release.apk
            iphone-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
